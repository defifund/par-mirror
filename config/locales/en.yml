    creator:
      title: "To you"
      blurb: "Accrues to your fee wallet in the escrow. Claim any time."
    holders:
      title: "To holders"
      blurb: "Fees were paid out to holders every hour by the original team."
      launch_note: "Disabled: the vault forwards fees to the original team's holder-rewards wallet, which ran the hourly payouts. Without the team, holders may never be paid."
      token_note: "Fees of this token go to holders through the original team's holder-rewards wallet, which ran the hourly payouts. With par.family offline those payouts may have stopped: fees keep accruing but may never reach holders."
    burn:
      title: "Buyback & burn"
      blurb: "Fees were used to buy the token back in its own pool and burn it."
      launch_note: "Disabled: only the vault's operator (the original team) can run the quote-side buyback, so that half of the fees would sit in the vault unused."
      token_note: "Buyback & burn: the token-side share is still burned (anyone can trigger it), but the quote-side buyback can only be run by the vault's operator, the original team. That half may sit in the vault unused."
    floor:
      title: "Floor mode"
      blurb: "A locked bid wall that can absorb the whole circulating supply; it only ever rises."
      launch_note: "Disabled until this mirror's keeper runs: the wall only moves when someone calls rebalance (open to anyone, previously done by the team's keeper)."
      token_note: "Floor mode: the bid wall only moves up when someone calls rebalance on the floor vault. Anyone can, but the original team's keeper no longer does, so the floor may lag behind."

